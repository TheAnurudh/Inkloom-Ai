# Used when SPRING_PROFILES_ACTIVE=prod (set this on your hosting platform).
# Behind the platform's HTTPS proxy: trust X-Forwarded-* so the app knows the request was HTTPS and sees the real client IP.
server.forward-headers-strategy=native
inkloom.demo.enabled=false
logging.level.com.inkloom=INFO
logging.level.org.hibernate.SQL=WARN
# "update" creates missing tables on first deploy. Later switch to "validate" (or use Flyway migrations).
spring.jpa.hibernate.ddl-auto=update
