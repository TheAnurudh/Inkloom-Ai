spring.config.import=optional:classpath:application-local.properties
spring.application.name=inkloom-backend
# PORT is injected by hosting platforms (Render/Railway/...)
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inkloom_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# No real password in this file (it goes to GitHub). Put it in application-local.properties or an env var.
spring.datasource.password=${DB_PASSWORD:root}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Console logging / debugging ----------
logging.level.root=INFO
logging.level.com.inkloom=DEBUG
# Prints every SQL statement (set to INFO to silence)
logging.level.org.hibernate.SQL=DEBUG
# Prints security filter chain details (set to DEBUG when you debug 401/403 problems)
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{rid}] %logger{18} - %msg%n

# ---------- Errors: never leak internals ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------- JWT 
inkloom.jwt.secret=${JWT_SECRET:dfaWU20HNbrVWg9LJaKnVQhtlr+gzMjQXGOji4KhMGU=}
inkloom.jwt.expiration-minutes=30
inkloom.jwt.issuer=inkloom

inkloom.security.max-failed-attempts=5
inkloom.security.lock-minutes=15
inkloom.security.rate-limit-per-minute=30
# Production: set CORS_ORIGINS=https://your-frontend.com (comma separated, no wildcard)
inkloom.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Console demo: runs a full workflow at startup and prints it ----------
# Set to false once you are done testing so it does not create demo data on every start.
inkloom.demo.enabled=false

# ---------- Email verification ----------
# false = links are printed in the console (dev). true = real emails through SMTP.
inkloom.mail.enabled=${MAIL_ENABLED:false}
inkloom.mail.from=${MAIL_FROM:no-reply@inkloom.local}
inkloom.mail.verification-hours=24
# Base URL of your FRONTEND. The email contains  <frontend-url>/verify-email?token=...
inkloom.frontend-url=${FRONTEND_URL:http://localhost:3000}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Real AI (Anthropic). If off or failing, the rule-based checker is used automatically ----------
ai.enabled=${AI_ENABLED:false}
ai.api-key=${ANTHROPIC_API_KEY:}
ai.model=${AI_MODEL:claude-sonnet-5-5}
ai.base-url=https://api.anthropic.com
ai.timeout-ms=20000
ai.max-checks-per-user-per-hour=30