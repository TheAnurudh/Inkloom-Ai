spring.application.name=inkloom-compliance
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/inkloom}
server.port=8080

# AI second opinion (tone, subtle claims). Leave the key empty to run rules-only.
inkloom.ai.enabled=true
inkloom.ai.gemini.api-key=${GEMINI_API_KEY:}
inkloom.ai.gemini.model=gemini-2.0-flash
